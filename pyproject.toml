[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oss-launchpad-cli"
version = "0.1.0"
description = "CLI for bootstrapping public OSS project launch scaffolding"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MosslandOpenDevs" }]

[project.scripts]
oss-launchpad = "oss_launchpad_cli.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
